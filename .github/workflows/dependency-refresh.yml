name: One-time dependency refresh (review branch)
on:
  push:
    branches: [chore/upgrade-all-deps-20261024]
    paths:
      - '.github/workflows/dependency-refresh.yml'
permissions:
  contents: write
jobs:
  update-dependencies:
    name: Upgrade and validate latest stable npm dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Update workspace manifests from npm registry
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const files = [
            "package.json",
            "apps/admin/package.json",
            "apps/api/package.json",
            "apps/bot/package.json",
            "apps/web/package.json",
            "packages/shared/package.json",
          ];
          const cache = new Map();
          function latestStable(name) {
            if (cache.has(name)) return cache.get(name);
            // Prisma CLI's current "latest" tag is an incompatible 8.0 release candidate.
            // Remain on the latest Prisma 6 for schema and runtime compatibility.
            const selector = name === "prisma" || name === "@prisma/client"
              ? name + "@6"
              : name === "@types/node" ? name + "@24" : name + "@latest";
            const output = execFileSync("npm", ["view", selector, "version", "--json"], {
              encoding: "utf8", timeout: 90000,
            }).trim();
            const raw = JSON.parse(output);
            const versions = (Array.isArray(raw) ? raw : [raw])
              .filter((v) => typeof v === "string" && /^\d+\.\d+\.\d+$/.test(v));
            if (!versions.length) throw new Error("No stable release: " + selector);
            versions.sort((a, b) => {
              const x = a.split(".").map(Number), y = b.split(".").map(Number);
              return (x[0] - y[0]) || (x[1] - y[1]) || (x[2] - y[2]);
            });
            const version = versions.at(-1);
            cache.set(name, version);
            console.log(name + " -> " + version);
            return version;
          }
          for (const file of files) {
            const doc = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const section of ["dependencies", "devDependencies", "optionalDependencies"]) {
              for (const [name, old] of Object.entries(doc[section] ?? {})) {
                if (old.startsWith("workspace:")) continue;
                const target = latestStable(name);
                const prefix = old.startsWith("^") ? "^" : old.startsWith("~") ? "~" : "";
                doc[section][name] = prefix + target;
              }
            }
            if (file === "package.json") {
              // Stay on the patched Undici v7 major required by existing Discord code.
              // Moving to v8 requires a separate compatibility review.
              doc.pnpm.overrides.undici = "7.30.1";
            }
            fs.writeFileSync(file, JSON.stringify(doc, null, 2) + "\n");
          }
          NODE
      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
      - name: Commit dependency candidates to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/*/package.json packages/*/package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh npm dependencies to latest stable versions"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push origin HEAD:chore/upgrade-all-deps-20261024
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install frozen lockfile
        run: pnpm install --frozen-lockfile
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
      - name: Generate Prisma client
        run: pnpm --filter @sumirevox/bot exec prisma generate
      - name: Build shared package
        run: pnpm --filter @sumirevox/shared build
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Audit high severity vulnerabilities
        run: pnpm audit --prod --audit-level=high
